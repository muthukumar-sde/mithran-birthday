<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#311b92" />
      <stop offset="100%" stop-color="#4a148c" />
    </linearGradient>
    <linearGradient id="cakeLayer1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <linearGradient id="cakeLayer2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="frostingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fce7f3" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="flameGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Icon Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="rgba(244, 114, 182, 0.4)" stroke-width="8" />

  <!-- Background Glow behind Candles -->
  <circle cx="256" cy="160" r="120" fill="url(#glowGrad)" />

  <g filter="url(#shadow)">
    <!-- Plate -->
    <ellipse cx="256" cy="410" rx="180" ry="24" fill="#cbd5e1" opacity="0.9" />
    <ellipse cx="256" cy="406" rx="165" ry="18" fill="url(#frostingGrad)" />

    <!-- Cake Bottom Layer -->
    <path d="M 120,330 Q 256,360 392,330 L 392,390 Q 256,420 120,390 Z" fill="url(#cakeLayer1)" />
    <!-- Bottom Frosting Drips -->
    <path d="M 120,330 Q 150,350 180,335 Q 210,355 256,338 Q 300,355 330,335 Q 360,350 392,330 Q 256,350 120,330 Z" fill="url(#frostingGrad)" />

    <!-- Cake Top Layer -->
    <path d="M 145,250 Q 256,275 367,250 L 367,330 Q 256,360 145,330 Z" fill="url(#cakeLayer2)" />

    <!-- Top Frosting Cream -->
    <ellipse cx="256" cy="250" rx="111" ry="25" fill="url(#frostingGrad)" />
    <!-- Cream Swirl Drips -->
    <path d="M 145,250 C 155,275 175,275 185,255 C 195,280 220,280 230,255 C 245,282 270,282 285,255 C 298,280 320,280 330,255 C 345,275 360,270 367,250 Q 256,270 145,250 Z" fill="url(#frostingGrad)" />

    <!-- Decorative Cherries / Sprinkles -->
    <circle cx="170" cy="245" r="9" fill="#ef4444" />
    <circle cx="342" cy="245" r="9" fill="#ef4444" />
    <circle cx="210" cy="252" r="6" fill="#3b82f6" />
    <circle cx="302" cy="252" r="6" fill="#10b981" />
    <circle cx="256" cy="255" r="7" fill="#f59e0b" />

    <!-- Left Candle -->
    <rect x="188" y="160" width="16" height="75" rx="4" fill="url(#goldGrad)" />
    <!-- Center Candle (Tallest) -->
    <rect x="248" y="135" width="16" height="100" rx="4" fill="url(#goldGrad)" />
    <!-- Right Candle -->
    <rect x="308" y="160" width="16" height="75" rx="4" fill="url(#goldGrad)" />

    <!-- Candle Wicks -->
    <line x1="196" y1="160" x2="196" y2="150" stroke="#475569" stroke-width="3" />
    <line x1="256" y1="135" x2="256" y2="123" stroke="#475569" stroke-width="3" />
    <line x1="316" y1="160" x2="316" y2="150" stroke="#475569" stroke-width="3" />

    <!-- Flames with glow -->
    <g filter="url(#flameGlow)">
      <!-- Left Flame -->
      <path d="M 196,150 C 185,135 190,118 196,108 C 202,118 207,135 196,150 Z" fill="url(#flameGrad)" />
      <!-- Center Flame -->
      <path d="M 256,123 C 242,105 249,82 256,70 C 263,82 270,105 256,123 Z" fill="url(#flameGrad)" />
      <!-- Right Flame -->
      <path d="M 316,150 C 305,135 310,118 316,108 C 322,118 327,135 316,150 Z" fill="url(#flameGrad)" />
    </g>

    <!-- Inner Flame Glow Core -->
    <path d="M 196,145 C 190,137 193,126 196,120 C 199,126 202,137 196,145 Z" fill="#ffffff" />
    <path d="M 256,118 C 248,106 252,92 256,84 C 260,92 264,106 256,118 Z" fill="#ffffff" />
    <path d="M 316,145 C 310,137 313,126 316,120 C 319,126 322,137 316,145 Z" fill="#ffffff" />
  </g>

  <!-- Sparkles -->
  <path d="M 120,120 L 125,135 L 140,140 L 125,145 L 120,160 L 115,145 L 100,140 L 115,135 Z" fill="#fef08a" opacity="0.9" />
  <path d="M 390,110 L 394,122 L 406,126 L 394,130 L 390,142 L 386,130 L 374,126 L 386,122 Z" fill="#fef08a" opacity="0.9" />
  <path d="M 410,280 L 413,290 L 423,293 L 413,296 L 410,306 L 407,296 L 397,293 L 407,290 Z" fill="#f472b6" opacity="0.8" />
</svg>
